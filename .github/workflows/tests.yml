name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} / zc.buildout ${{ matrix.buildout }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        buildout: ["5", "6"]
        exclude:
          # zc.buildout 6 requires Python 3.10+
          - python: "3.9"
            buildout: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Run tests
        run: >
          uv run --isolated --python ${{ matrix.python }}
          --with "zc.buildout==${{ matrix.buildout }}.*"
          pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
